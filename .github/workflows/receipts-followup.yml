name: Receipts — Follow-up

on:
  # Fires when any workflow run completes (CI pass or fail).
  # Change 'CI' to match the actual name of your CI workflow.
  workflow_run:
    workflows: ['CI']
    types: [completed]

  # Also fires when a PR is closed (merged OR closed without merge / revert).
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  followup:
    name: Receipts Follow-up
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Post follow-up receipt comment
        run: node action/followup.js
        env:
          INPUT_GITHUB-TOKEN: ${{ secrets.GITHUB_TOKEN }}
